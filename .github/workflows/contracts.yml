name: Export contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-contracts.txt
      - run: python tools/check_export_contracts.py
      - run: python -m unittest discover -s tools/audit/sys48-contract -p 'test_*.py'
  loaders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew --no-daemon clean :common:test :fabric:build :forge:build
      - name: Collect remapped loader JARs and checksums
        shell: bash
        run: |
          set -euo pipefail
          archive=$(sed -n 's/^archives_base_name=//p' gradle.properties)
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          test -n "$archive" && test -n "$version"
          destination="$RUNNER_TEMP/mcmods-remapped"
          mkdir "$destination"
          for loader in fabric forge; do
            jar="$loader/build/libs/$archive-$version.jar"
            metadata=fabric.mod.json
            if [[ "$loader" == forge ]]; then metadata=META-INF/mods.toml; fi
            # Both remapJar tasks set archiveClassifier to null.
            unzip -tq "$jar"
            test "$(unzip -Z1 "$jar" "$metadata")" = "$metadata"
            cp "$jar" "$destination/$archive-$version-$loader.jar"
          done
          cd "$destination"
          sha256sum -- *.jar > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcmods-exporter-${{ github.sha }}
          path: ${{ runner.temp }}/mcmods-remapped/
          if-no-files-found: error
          compression-level: 0
